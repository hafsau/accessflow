[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "accessflow-runtime"
version = "0.1.0"
description = "AccessFlow Case Orchestrator on AgentCore Runtime (Strands Agents)"
requires-python = ">=3.12"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "boto3 >= 1.43.0",
    "strands-agents == 1.53.0",
    "cedarpy == 4.8.7",
    "httpx >= 0.28.1",
    "pydantic >= 2.13.0",
    "pypdf >= 6.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
