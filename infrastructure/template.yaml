AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AccessFlow - Background Poller Infrastructure

Parameters:
  DailyUsdCap:
    Type: String
    Default: "1.50"
    Description: Daily spend cap in USD
  AgentCoreRuntimeArn:
    Type: String
    Default: "arn:aws:bedrock-agentcore:us-west-2:684589295815:runtime/AccessFlow_AccessFlow-WrVmzyAk66"
    Description: AgentCore runtime ARN
  FingerprintTableName:
    Type: String
    Default: "accessflow-fingerprints"
    Description: Existing DynamoDB table for fingerprints
  BudgetTableName:
    Type: String
    Default: "accessflow-budget"
    Description: Existing DynamoDB table for budget
  AgendaCacheBucketName:
    Type: String
    Default: "accessflow-agenda-cache-684589295815"
    Description: Existing S3 bucket for agenda cache

Globals:
  Function:
    Timeout: 60
    Runtime: python3.12
    MemorySize: 512
    Architectures:
      - arm64

Resources:
  # SQS queue for meeting processing
  MeetingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: accessflow-meetings
      VisibilityTimeout: 900  # 15 minutes to match worker Lambda timeout

  # Poller Lambda - detects changes and queues meetings
  PollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: accessflow-poller
      CodeUri: ../backend/
      Handler: poller.poller_handler.handler
      Description: AccessFlow background poller - polls Legistar every 15 minutes
      Environment:
        Variables:
          FINGERPRINT_TABLE: !Ref FingerprintTableName
          BUDGET_TABLE: !Ref BudgetTableName
          AGENDA_CACHE_BUCKET: !Ref AgendaCacheBucketName
          MEETING_QUEUE_URL: !Ref MeetingQueue
          BUDGET_STORAGE: dynamodb
          AGENDA_CACHE_ENABLED: "true"
          MODEL_PROVIDER: bedrock
          DAILY_USD_CAP: !Ref DailyUsdCap
          CORE_TABLE: accessflow-core
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FingerprintTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref BudgetTableName
        - S3CrudPolicy:
            BucketName: !Ref AgendaCacheBucketName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MeetingQueue.QueueName
      Events:
        ScheduledPoll:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Description: Poll Legistar every 15 minutes
            Enabled: true
      # CRITICAL: No VpcConfig - NAT Gateway costs $47.52 over judging window

  # Worker Lambda - processes meetings from SQS, calls AgentCore runtime
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: accessflow-worker
      CodeUri: ../backend/
      Handler: poller.worker_handler.handler
      Timeout: 900  # 15 minutes for ~4 minute AgentCore calls
      MemorySize: 1024
      Description: AccessFlow worker - processes meetings via AgentCore runtime
      Environment:
        Variables:
          AGENTCORE_RUNTIME_ARN: !Ref AgentCoreRuntimeArn
          CORE_TABLE: accessflow-core
          BUDGET_TABLE: !Ref BudgetTableName
          BUDGET_STORAGE: dynamodb
          MODEL_PROVIDER: bedrock
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BudgetTableName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock-agentcore:InvokeAgentRuntime
              Resource: !Sub "${AgentCoreRuntimeArn}*"
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - arn:aws:dynamodb:us-west-2:684589295815:table/accessflow-core
                - arn:aws:dynamodb:us-west-2:684589295815:table/accessflow-core/index/*
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt MeetingQueue.Arn
            BatchSize: 1  # Process one meeting at a time

  # Console Lambda - public read-only dashboard with Function URL
  ConsoleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: accessflow-console
      CodeUri: ../backend/
      Handler: console.handler.handler
      Timeout: 30
      MemorySize: 256
      Description: AccessFlow operations console - public read-only dashboard
      Environment:
        Variables:
          CORE_TABLE: accessflow-core
          MEETING_QUEUE_URL: !Ref MeetingQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:UpdateItem
                - dynamodb:PutItem
              Resource:
                - arn:aws:dynamodb:us-west-2:684589295815:table/accessflow-core
                - arn:aws:dynamodb:us-west-2:684589295815:table/accessflow-core/index/*
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt MeetingQueue.Arn
      FunctionUrlConfig:
        AuthType: NONE  # Public, no credentials required

Outputs:
  PollerFunctionArn:
    Description: Poller Lambda ARN
    Value: !GetAtt PollerFunction.Arn

  WorkerFunctionArn:
    Description: Worker Lambda ARN
    Value: !GetAtt WorkerFunction.Arn

  MeetingQueueUrl:
    Description: Meeting processing SQS queue URL
    Value: !Ref MeetingQueue

  ConsoleFunctionUrl:
    Description: Public console URL (no auth required)
    Value: !GetAtt ConsoleFunctionUrl.FunctionUrl
